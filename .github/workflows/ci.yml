# QR Pocket CI — SPEC-005 (ADR-008, ADR-011, ADR-018). Runs on pull requests and pushes to main, and is CALLED by deploy.yml
# so a deployment re-runs exactly these checks. Results are recorded in docs/PROGRESS.md.
# Action pins (GitHub API lookup 2026-10-22): checkout v7.0.1, setup-node v7.1.0, upload-artifact v7.0.2, upload-pages-artifact v5.0.0.
# RE-VERIFY the tag -> SHA mapping whenever a pin is changed (Dependabot proposes updates).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}   # github.workflow is the caller's name when called by deploy.yml
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22        # ADR-011: satisfies vite 8 / vitest 5 / axe engines
          cache: npm

      - run: npm ci               # fails if lockfile is missing or out of sync (intended)
      - name: 'Workflow files are valid YAML (deploy.yml cannot be parsed by GitHub before it is on main)'
        run: python3 -c 'import sys, yaml; [print(f, sorted(map(str, yaml.safe_load(open(f))))) for f in sys.argv[1:]]' .github/workflows/*.yml
        if: ${{ !cancelled() }}
      - run: npm run typecheck   # tsc --noEmit, strict
        if: ${{ !cancelled() }}
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm test             # vitest run (SPEC-001..003 unit tests)
        if: ${{ !cancelled() }}
      - run: npm run build        # icons + vite build (PWA manifest + service worker), base /qr-pocket/
        if: ${{ !cancelled() }}
      - run: npm run build:v2     # second build (id v2) into dist-v2: the update tests simulate a new deployment
        if: ${{ !cancelled() }}
      - run: npm run stamp        # dist/version.json = the commit these bytes were built from (not precached)
        if: ${{ !cancelled() }}
      - run: npm run check:public # SPEC-005 AC6: no maps, secrets, local paths or unexpected URLs in what would be published
        if: ${{ !cancelled() }}
      - run: npm run check:size   # fails if initial JS+CSS gzip > 150 KB (target; measured, reported)
        if: ${{ !cancelled() }}
      - run: npm audit --omit=dev --audit-level=high
        if: ${{ !cancelled() }}
      - name: 'npm audit, all dependencies (informational, build tooling only)'
        run: npm audit --audit-level=high || true
        if: ${{ !cancelled() }}
      - run: npm run check:licenses
        if: ${{ !cancelled() }}

      - run: npx playwright install --with-deps chromium firefox webkit
        if: ${{ !cancelled() }}
      - run: npm run test:e2e     # vite preview --base /qr-pocket/, axe-core, offline, subpath
        if: ${{ !cancelled() }}
        timeout-minutes: 25

      # The exact bytes that passed every check above (e2e ran on this dist). deploy.yml publishes THIS artifact; on pull
      # requests it is a dry run that proves the Pages packaging works. Only after ALL previous steps succeeded.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ success() }}
        with:
          path: dist
          retention-days: 1

      # Pictures for docs/USER_GUIDE.md, rendered from the real build. Documentation tooling, not a gate: it runs after
      # the Pages artifact exists and cannot block or alter what is published.
      - run: npm run screenshots
        if: ${{ !cancelled() }}
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: user-guide-screenshots
          path: user-guide-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            size-report.txt
            public/icons/
            dist/manifest.webmanifest
            dist/sw.js
          retention-days: 14

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### QR Pocket CI"
            echo "- Commit: ${{ github.sha }}"
            echo "- Node: $(node -v)"
            if [ -f size-report.txt ]; then echo '- Bundle size:'; echo '```'; cat size-report.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
# Not included on purpose: any deployment (deploy.yml is separate and manual), secrets, pull_request_target.
