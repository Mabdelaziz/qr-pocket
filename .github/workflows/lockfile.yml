# One-time/occasional MANUAL workflow: creates package-lock.json in the cloud (no npm on the laptop).
# INERT until pushed (needs owner G2). NOT RUN. Read-only permissions; the lockfile is uploaded as an artifact
# for a human (or `gh run download`) to commit. Re-verify the action SHAs before use.
name: Generate lockfile (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (re-verify before use)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (re-verify before use)
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (re-verify before use)
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 7
