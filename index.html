<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light">
  <title>QR Pocket</title>
  <link rel="icon" href="data:,">
  <script type="module" src="/src/main.ts"></script>
</head>
<body>

  <div class="app">
    <header class="hdr">
    <svg class="sprite" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#155EEF"/><g fill="#fff"><path d="M6 6h7v7H6zM19 6h7v7h-7zM6 19h7v7H6z" opacity=".95"/><path d="M19 19h3v3h-3zM23 23h3v3h-3zM23 19h3v2h-3z"/></g><g fill="#155EEF"><rect x="8" y="8" width="3" height="3"/><rect x="21" y="8" width="3" height="3"/><rect x="8" y="21" width="3" height="3"/></g></symbol>
        <symbol id="i-gen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></symbol>
        <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.01"/></symbol>
        <symbol id="i-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.01"/></symbol>
        <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.4v.01"/></symbol>
      </defs>
    </svg>
      <span class="brand"><svg class="logo" aria-hidden="true" focusable="false"><use href="#logo"/></svg>QR Pocket</span>
    </header>

    <main id="main">
      <h1>Create a QR code</h1>

      <section class="card" aria-label="Your text">
        <label for="text">Text or link</label>
        <textarea id="text" rows="3" dir="auto" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="Type or paste text or a link" aria-describedby="count hint panel-host"></textarea>
        <div class="metarow">
          <p id="count" class="meta"></p>
          <button type="button" id="clear" class="link" hidden>Clear</button>
        </div>
        <p id="hint" class="hint">Encodes exactly what you type. Links aren&rsquo;t shortened or checked.</p>
      </section>

      <div id="ecc-low" class="eccrow" hidden>
        <svg class="ico sm" aria-hidden="true" focusable="false"><use href="#i-info"/></svg>
        <span><strong>Error correction: Low</strong></span>
        <button type="button" id="ecc-back" class="link">Back to Medium</button>
      </div>

      <div id="panel-host"></div>

      <div id="preview" class="pvwrap"></div>

      <p id="sr-status" class="sr" role="status"></p>
      <noscript><p class="panel p-error">QR Pocket needs JavaScript to create QR codes on your device.</p></noscript>
    </main>
  </div>
</body>
</html>
